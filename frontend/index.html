<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Akcion</title>
    <script>
      /*
       * Téma se nastavuje dřív, než se vykreslí první pixel. Bez toho
       * stránka problikne světlá a teprve pak ztmavne — u aplikace, kterou
       * někdo otevírá večer, je to rána do očí.
       *
       * Klíč a hodnoty musí sedět s src/design/theme.ts.
       */
      (function () {
        try {
          var choice = localStorage.getItem('akcion.theme');
          if (choice === 'light' || choice === 'dark') {
            document.documentElement.setAttribute('data-theme', choice);
          }
        } catch (e) {
          /* Zakázaná data webu. Rozhodne prefers-color-scheme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
